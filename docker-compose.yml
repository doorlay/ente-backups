services:
  backups:
    build: .
    env_file: .env
    volumes:
      - ${EXPORT_DIR:-/data/ente-photos}:${EXPORT_DIR:-/data/ente-photos}
      - ente-cli-data:/cli-data
      - results:/srv/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/srv/backups/ente-sync.lock"]
      interval: 5m
      timeout: 10s
      retries: 3

volumes:
  ente-cli-data: {}
  results: {}
